# External Agent bundle (Plan B) — pull both images, one command.
#
# What this does:
#   - pulls the prebuilt signer + runner images from GHCR
#   - wires the loopback signing contract the platform requires:
#       * signer listens on 127.0.0.1:8020  (loopback only, NEVER published)
#       * runner shares the signer's network namespace
#         (network_mode: "service:signer") so it reaches the signer at
#         http://127.0.0.1:8020
#       * the runner's public port 8010 is published HERE (on the signer's
#         netns, which the runner shares) so the platform can dispatch to it
#
# The platform NEVER contacts the signer. It only reaches the runner endpoint.
# The agent's private keys stay in the signer on the operator's machine.
#
# Quick start (operator machine):
#   cp agent.env.example agent.env
#   mkdir -p signer-config && cp services/agent-signer/config.example.json signer-config/signer-config.json
#   docker compose -f docker-compose.agent.yml --env-file agent.env up -d
#
# Image build/push (maintainer): see docs/AGENT_EXTERNAL_ONBOARDING.md
name: agent-external

services:
  signer:
    image: ${SIDECAR_IMAGE:-ghcr.io/yuan1803580/agent-signer:latest}
    environment:
      APP_ENV: production
      AGENT_SIGNER_CONFIG_FILE: /app/config/signer-config.json
      SIDECAR_KEY_DIR: /app/data/keys
      SIDECAR_RUN_MIGRATIONS: "true"
      # Secrets auto-generated by the entrypoint when blank (see doc).
      SIDECAR_PROVISIONING_TOKEN: ${SIDECAR_PROVISIONING_TOKEN:-}
      SIDECAR_STORAGE_KEY: ${SIDECAR_STORAGE_KEY:-}
      WORKER_INTENT_HMAC_SECRET: ${WORKER_INTENT_HMAC_SECRET:-}
    volumes:
      # RW is REQUIRED: /v1/provision appends the provisioned agent entry here.
      - ./signer-config:/app/config:rw
      - sidecar_keys:/app/data/keys
      - signer_data:/app/data
    # Publishes the RUNNER's port through the shared netns (runner listens 8010).
    # The signer itself binds 127.0.0.1:8020 and is NOT reachable from outside.
    ports:
      - "${RUNNER_PORT:-8010}:8010"
    restart: unless-stopped

  runner:
    image: ${RUNNER_IMAGE:-ghcr.io/yuan1803580/agent-runner:latest}
    # Shares the signer's network namespace so loopback signing works.
    network_mode: "service:signer"
    depends_on:
      - signer
    environment:
      APP_ENV: production
      RUNNER_PROFILE: managed
      PLATFORM_API_URL: ${PLATFORM_API_URL}
      AGENT_RUNNER_API_TOKEN: ${AGENT_RUNNER_API_TOKEN:-}
      RUNNER_CONTROL_HMAC_SECRET: ${RUNNER_CONTROL_HMAC_SECRET:-}
      # NEVER on the platform side — lives only in the operator's runner env.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      # Read the signer credential (Bearer token) to authenticate to the signer.
      - sidecar_keys:/app/data/keys:ro
      - runner_data:/app/data
    restart: unless-stopped

volumes:
  sidecar_keys:
  signer_data:
  runner_data:
